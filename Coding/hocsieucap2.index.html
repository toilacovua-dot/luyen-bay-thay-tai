<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Luyện bay cùng thầy Đặng Tài</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(-45deg, #4f46e5, #9333ea, #06b6d4);
  background-size: 300% 300%;
  animation: gradient 10s ease infinite;
}
@keyframes gradient {
  0%,100% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
}
.glass {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body class="text-white p-6">

<!-- VIDEO SECTION -->
<div class="max-w-2xl mx-auto glass p-6 shadow-2xl border border-white/10 mb-10">
  <div class="relative group overflow-hidden rounded-xl bg-black">
    <!-- Thêm preload="auto" để trình duyệt nạp video nhanh hơn -->
    <video id="mainVideo" class="w-full aspect-video cursor-pointer" preload="auto">
      <source src="video.mp4" type="video/mp4">
      Trình duyệt của bạn không hỗ trợ video này.
    </video>
    
    <div id="play-overlay" onclick="togglePlay()" class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity">
       <div class="w-16 h-16 bg-purple-600/80 rounded-full flex items-center justify-center text-2xl">▶️</div>
    </div>
  </div>

  <div class="flex items-center gap-4 mt-4 bg-white/5 p-3 rounded-lg">
    <button onclick="togglePlay()" id="playBtn" class="hover:scale-110 transition text-xl">▶️</button>

    <!-- Đổi ID thành videoProgress để tránh trùng với phòng thi -->
    <input 
      type="range" 
      id="videoProgress" 
      value="0" 
      class="flex-1 h-1.5 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-purple-500"
    >

    <div class="flex items-center gap-3">
      <button onclick="toggleMute()" id="muteBtn" class="hover:text-purple-400 transition text-lg">🔊</button>
      <button onclick="toggleFull()" class="hover:text-purple-400 transition text-lg">⛶</button>
    </div>
  </div>
</div>

<!-- HERO -->
<div class="glass p-10 text-center mb-10">
  <h1 class="text-4xl font-bold mb-4">🚀 Luyện bay cùng thầy Đặng Tài</h1>
  <p class="mb-6 italic text-blue-200">"Học nhẹ thôi… mà bay cao thật"</p>
  <button onclick="scrollToExam()" class="px-6 py-3 bg-purple-600 rounded-xl hover:scale-105 transition font-bold">Vào phòng luyện thi</button>
</div>

<!-- PROFILE -->
<div class="flex justify-center mb-10">
  <div class="relative">
    <div class="absolute -inset-1 bg-white/20 rounded-full blur"></div>
    <img src="thay-tai.jpg" class="relative w-48 h-48 rounded-full border-4 border-white/20 object-cover shadow-2xl">
  </div>
</div>

<!-- COURSES -->
<div class="grid md:grid-cols-3 gap-6 mb-20">
  <div class="glass p-4 hover:scale-105 transition border-t-4 border-blue-400">
    <h2 class="text-xl mb-3 font-bold">Lớp 10</h2>
    <iframe class="w-full rounded-lg" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
  </div>
  <div class="glass p-4 hover:scale-105 transition border-t-4 border-purple-400">
    <h2 class="text-xl mb-3 font-bold">Lớp 11</h2>
    <iframe class="w-full rounded-lg" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
  </div>
  <div class="glass p-4 hover:scale-105 transition border-t-4 border-cyan-400">
    <h2 class="text-xl mb-3 font-bold">Lớp 12</h2>
    <iframe class="w-full rounded-lg" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
  </div>
</div>

<!-- EXAM SECTION -->
<div id="exam" class="glass p-8 max-w-xl mx-auto shadow-2xl border border-purple-500/30">
  <div class="flex justify-between items-center mb-4">
    <span class="font-bold text-yellow-400">🔥 PHÒNG THỬ THÁCH</span>
    <div class="bg-black/30 px-3 py-1 rounded-full">⏳ <span id="time">60</span>s</div>
  </div>

  <div class="w-full bg-gray-700 h-2 rounded my-4 overflow-hidden">
    <!-- Đổi ID thành examProgressBar -->
    <div id="examProgressBar" class="bg-gradient-to-r from-purple-500 to-blue-500 h-2 transition-all duration-300" style="width:0%"></div>
  </div>

  <h2 id="question" class="text-xl font-medium min-h-[60px]"></h2>
  <div id="answers" class="space-y-3 mt-6"></div>
  <div id="result" class="mt-6 text-center text-2xl font-bold text-green-400"></div>
</div>

<script>
// --- LOGIC VIDEO ---
const video = document.getElementById("mainVideo");
const vProgress = document.getElementById("videoProgress");
const playBtn = document.getElementById("playBtn");

function togglePlay() {
  if (video.paused) { video.play(); playBtn.innerText = "⏸️"; }
  else { video.pause(); playBtn.innerText = "▶️"; }
}

function toggleMute() {
  video.muted = !video.muted;
  document.getElementById("muteBtn").innerText = video.muted ? "🔇" : "🔊";
}

function toggleFull() {
  if (video.requestFullscreen) video.requestFullscreen();
}

video.addEventListener("timeupdate", () => {
  if (video.duration) {
    vProgress.value = (video.currentTime / video.duration) * 100;
  }
});

vProgress.addEventListener("input", () => {
  video.currentTime = (vProgress.value / 100) * video.duration;
});

// --- LOGIC THI CỬ ---
const questions = [
  { q: "Thầy Đặng Tài dạy lớp mấy?", options: ["Lớp 10","Lớp 11","Lớp 12","Tất cả các lớp"], answer: 3 },
  { q: "Công thức tính diện tích hình tròn?", options: ["πr²","2πr","πd","r²"], answer: 0 },
  { q: "Chương trình 'Luyện bay' giúp bạn làm gì?", options: ["Bay thật","Điểm cao","Đi ngủ","Đi chơi"], answer: 1 }
];

let current = 0;
let score = 0;
let timeLeft = 60;

function loadQuestion() {
  if (current >= questions.length) {
    document.getElementById("question").innerText = "Chúc mừng bạn đã hoàn thành!";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("result").innerText = "Kết quả: " + score + "/" + questions.length;
    return;
  }

  const q = questions[current];
  document.getElementById("question").innerText = `Câu ${current + 1}: ${q.q}`;
  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  q.options.forEach((op, i) => {
    const btn = document.createElement("button");
    btn.innerText = op;
    btn.className = "block w-full p-3 bg-white/10 rounded-xl hover:bg-purple-600 transition text-left pl-6 border border-white/5";
    btn.onclick = () => {
      if (i === q.answer) score++;
      current++;
      updateExamProgress();
      loadQuestion();
    };
    answersDiv.appendChild(btn);
  });
}

function updateExamProgress() {
  const percent = (current / questions.length) * 100;
  document.getElementById("examProgressBar").style.width = percent + "%";
}

setInterval(() => {
  if(timeLeft > 0 && current < questions.length) {
    timeLeft--;
    document.getElementById("time").innerText = timeLeft;
  }
}, 1000);

function scrollToExam() {
  document.getElementById("exam").scrollIntoView({ behavior: "smooth" });
}

loadQuestion();
</script>
</body>
</html>
