<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Luyện bay cùng thầy Đặng Tài</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(-45deg, #4f46e5, #9333ea, #06b6d4);
  background-size: 300% 300%;
  animation: gradient 10s ease infinite;
}
@keyframes gradient {
  0%,100% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
}
.glass {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body class="text-white p-6">

<!-- VIDEO PLAYER -->
<div class="max-w-2xl mx-auto glass p-6 mb-10">
  <video id="video" class="w-full aspect-video rounded-xl bg-black">
    <source src="./video.mp4" type="video/mp4">
  </video>

  <div class="flex items-center gap-3 mt-3">
    <button onclick="togglePlay()" id="playBtn">▶️</button>

    <input type="range" id="video-progress" value="0" class="flex-1">

    <button onclick="toggleMute()">🔊</button>
    <button onclick="toggleFull()">⛶</button>
  </div>
</div>

<!-- HERO -->
<div class="glass p-10 text-center mb-10">
  <h1 class="text-4xl font-bold mb-4">🚀 Luyện bay cùng thầy Đặng Tài</h1>
  <button onclick="scrollToExam()" class="px-6 py-3 bg-purple-600 rounded-xl">
    Vào phòng luyện thi
  </button>
</div>

<!-- PROFILE -->
<div class="flex justify-center mb-10">
  <img src="thay-tai.jpg" class="w-48 h-48 rounded-full">
</div>

<!-- COURSES -->
<div class="grid md:grid-cols-3 gap-6 mb-20">
  <iframe class="w-full" height="200"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
</div>

<!-- EXAM -->
<div id="exam" class="glass p-6 max-w-xl mx-auto">
  <div>⏳ Thời gian: <span id="time">60</span>s</div>

  <div class="w-full bg-gray-700 h-2 rounded my-4">
    <div id="exam-progress" class="bg-purple-500 h-2 rounded" style="width:0%"></div>
  </div>

  <h2 id="question"></h2>
  <div id="answers" class="space-y-2 mt-4"></div>
  <div id="result" class="mt-4 text-xl"></div>
</div>

<script>
// ===== VIDEO =====
const video = document.getElementById("video");
const progress = document.getElementById("video-progress");
const playBtn = document.getElementById("playBtn");

function togglePlay() {
  if (video.paused) {
    video.play();
    playBtn.innerText = "⏸️";
  } else {
    video.pause();
    playBtn.innerText = "▶️";
  }
}

function toggleMute() {
  video.muted = !video.muted;
}

function toggleFull() {
  video.requestFullscreen();
}

video.addEventListener("timeupdate", () => {
  if (video.duration) {
    progress.value = (video.currentTime / video.duration) * 100;
  }
});

progress.addEventListener("input", () => {
  video.currentTime = (progress.value / 100) * video.duration;
});

// ===== EXAM =====
const questions = [
  { q: "1 + 1 = ?", options: ["1","2","3","4"], answer: 1 },
  { q: "2 + 2 = ?", options: ["2","3","4","5"], answer: 2 }
];

let current = 0;
let score = 0;
let time = 60;

function loadQuestion() {
  if (current >= questions.length) {
    document.getElementById("result").innerText =
      "Kết quả: " + score + "/" + questions.length;
    return;
  }

  const q = questions[current];
  document.getElementById("question").innerText = q.q;

  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  q.options.forEach((op, i) => {
    const btn = document.createElement("button");
    btn.innerText = op;
    btn.className = "block w-full p-2 bg-white/10 rounded";
    btn.onclick = () => {
      if (i === q.answer) score++;
      current++;
      updateProgress();
      loadQuestion();
    };
    answersDiv.appendChild(btn);
  });
}

function updateProgress() {
  const percent = (current / questions.length) * 100;
  document.getElementById("exam-progress").style.width = percent + "%";
}

setInterval(() => {
  time--;
  document.getElementById("time").innerText = time;
}, 1000);

function scrollToExam() {
  document.getElementById("exam").scrollIntoView({ behavior: "smooth" });
}

loadQuestion();
</script>

</body>
</html>
